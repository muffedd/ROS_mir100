# Small Nav2 overlay: A* planning and regulated pure pursuit path following.
planner_server:
  ros__parameters:
    GridBased:
      use_astar: true
      allow_unknown: true
controller_server:
  ros__parameters:
    controller_frequency: 12.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.3
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.4
      use_rotate_to_heading: true
      max_angular_accel: 1.2
      transform_tolerance: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.08
      min_approach_linear_velocity: 0.05
bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    bt_loop_duration: 50
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    transform_tolerance: 0.6
    source_timeout: 1.5
    observation_sources:
    - scan
    scan:
      topic: /scan
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.53
      track_unknown_space: false
      transform_tolerance: 0.6
      voxel_layer:
        observation_sources: scan
        scan:
          topic: /scan
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.53
      track_unknown_space: true
      transform_tolerance: 0.6
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan
