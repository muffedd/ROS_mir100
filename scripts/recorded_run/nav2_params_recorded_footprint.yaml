# nav2_params_recorded_footprint.yaml
# = repo config/nav2_params.yaml with robot_radius: 0.53 REPLACED in BOTH costmaps
# by the exact collision-derived footprint polygon (see footprint_derivation.py).
# Enclosing radius 0.5988 m ~ lead-audited 0.599 m; repo default 0.53 left laser corners outside.
# inflation_radius unchanged (0.70 from nav2 defaults in merged params) = tuning, not geometry-dictated;
# hardtest 0.90 dropped (stalled 1.9 m corridors). No other value changed.
# Small Nav2 overlay: A* planning and regulated pure pursuit path following.
planner_server:
  ros__parameters:
    GridBased:
      use_astar: true
      allow_unknown: true
controller_server:
  ros__parameters:
    controller_frequency: 12.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Faster default while retaining collision and curvature speed regulation.
      desired_linear_vel: 0.45
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.4
      use_rotate_to_heading: true
      max_angular_accel: 1.2
      transform_tolerance: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.08
      min_approach_linear_velocity: 0.05
bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    bt_loop_duration: 50
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    transform_tolerance: 0.6
    source_timeout: 1.5
    observation_sources:
    - scan
    scan:
      topic: /scan
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[-0.4679, -0.2352], [-0.4348, -0.3152], [-0.3548, -0.3483], [0.4876, -0.2900], [0.5419, 0.2358], [0.5088, 0.3158], [0.4288, 0.3489], [-0.4124, 0.2900]]"
      track_unknown_space: false
      transform_tolerance: 0.6
      voxel_layer:
        observation_sources: scan
        scan:
          topic: /scan
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[-0.4679, -0.2352], [-0.4348, -0.3152], [-0.3548, -0.3483], [0.4876, -0.2900], [0.5419, 0.2358], [0.5088, 0.3158], [0.4288, 0.3489], [-0.4124, 0.2900]]"
      track_unknown_space: true
      transform_tolerance: 0.6
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan
